<!DOCTYPE html>
<html>
<head>
    <title>Архив статей</title>
    <meta charset="UTF-8">
</head>
<body>
    <div class="header">
        <img src="https://www.djangoproject.com/m/img/logos/django-logo-negative.png" 
             style="height: 60px; margin-bottom: 10px;">
        <h1>Архив статей</h1>
    </div>
    
    <div class="archive">
        {% for post in posts %}
        <div class="one-post">
            <h2 class="post-title">{{ post.title }}</h2>
            <div class="article-info">
                <div class="article-author">{{ post.author.username }}</div>
                <div class="article-created-date">{{ post.created_date }}</div>
            </div>
            <p class="article-text">{{ post.get_excerpt }}</p>
        </div>
        {% empty %}
        <div class="one-post">
            <p>Статей пока нет. Создайте первую статью через админку.</p>
        </div>
        {% endfor %}
    </div>
    
    <div class="footer">
        <p>Всего статей: {{ posts|length }}</p>
    </div>
</body>
</html>
