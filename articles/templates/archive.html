
<!DOCTYPE html>
<html>
<head>
    <title>Архив статей</title>
    <meta charset="UTF-8">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body class="archive">
    <div class="header">
        <img src="https://www.djangoproject.com/m/img/logos/django-logo-negative.png" alt="Django">
        <h1>Архив статей</h1>
    </div>
    
    <div class="archive">
        {% for post in posts %}
        <div class="one-post">
            <h2 class="post-title">
                <a href="{% url 'get_article' post.id %}">{{ post.title }}</a>
            </h2>
            <div class="article-info">
                <div class="article-author">{{ post.author.username }}</div>
                <div class="article-created-date">{{ post.created_date }}</div>
            </div>
            <p class="article-text">{{ post.get_excerpt }}</p>
        </div>
        {% empty %}
        <p>Статей пока нет.</p>
        {% endfor %}
    </div>
</body>
</html>
