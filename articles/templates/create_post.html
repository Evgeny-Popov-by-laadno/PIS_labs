<!DOCTYPE html>
<html>
<head>
    <title>Django Public Blog - создать статью</title>
    <meta charset="UTF-8">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="content">
        <h1>Написать статью</h1>
        
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="title" placeholder="Название статьи" value="{{ form.title }}">
            <br>
            <textarea name="text" placeholder="Текст статьи" rows="10" cols="50">{{ form.text }}</textarea>
            <br>
            <input type="submit" value="Сохранить">
        </form>
        
        {% if form.errors %}
            <div class="error">
                {{ form.errors }}
            </div>
        {% endif %}
    </div>
</body>
</html>
